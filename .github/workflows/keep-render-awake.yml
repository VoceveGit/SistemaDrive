# Mantém o Render Free acordado.
# Importante: o cron do GitHub Actions atrasa com frequência; 10 min na prática
# vira 15–20 min e o Free já dormiu. Por isso */5.
name: Keep Render Awake

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Despacho health
        run: |
          set -e
          # Uma requisição leve: acorda o serviço + /health pode disparar varredura
          curl -fsS --max-time 90 "https://despacho-rtlg.onrender.com/api/health" \
            || curl -fsS --max-time 120 "https://despacho-rtlg.onrender.com/api/health" \
            || echo "ping falhou (cold start demorado)"
