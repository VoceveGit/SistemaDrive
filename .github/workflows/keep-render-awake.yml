# Keep-alive DESATIVADO — o ping frequente + o app geravam HTTP 429 no Render Free.
# Para reativar depois (com plano melhor ou intervalo bem maior), descomente o schedule.
name: Keep Render Awake

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */2 * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Despacho health
        run: |
          curl -fsS --max-time 60 "https://despacho-rtlg.onrender.com/api/health" || true
